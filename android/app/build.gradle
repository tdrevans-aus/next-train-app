apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.tdrevans.nexttrain"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "28.2.13676358"
    buildFeatures {
        buildConfig = true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    defaultConfig {
        applicationId "com.tdrevans.nexttrain"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 27
        versionName "3.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!_*.txt'
        }
    }
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.register('copyPinResolutionFixtures', Copy) {
    from("${rootDir}/../qa/fixtures/pin-resolution") {
        include '*.json'
        exclude 'schema.json'
    }
    into "${projectDir}/src/test/resources/pin-resolution"
    doLast {
        def indexFile = file("${projectDir}/src/test/resources/pin-resolution/index.txt")
        indexFile.parentFile.mkdirs()
        def names = fileTree("${projectDir}/src/test/resources/pin-resolution") {
            include '*.json'
        }.files.collect { it.name }.sort()
        indexFile.text = names.join('\n')
    }
}

tasks.named('preBuild').configure {
    dependsOn copyPinResolutionFixtures
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
apply from: 'native-debug-symbols.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// android/app/src/main/assets/public is gitignored, generated from the repo's
// public/ dir by `npx cap copy`/`cap sync`. Skipping that step before a build
// silently packages whichever stale copy is sitting on disk — this bit us
// repeatedly after adding new city regions (FB-53 fallout, Sep 2026): the app
// showed regions as "coming soon" that were already live on master because
// the assets folder predated the flip. Every build now refreshes it first.
tasks.register('capacitorCopyWebAssets', Exec) {
    workingDir "${projectDir}/../.."
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'npx', 'cap', 'copy', 'android'
    } else {
        commandLine 'npx', 'cap', 'copy', 'android'
    }
}

// `npm run cap:sync` prunes dev-only files (dogfood-origin.json, design/, lib/cities, etc. —
// scripts/prune-ship-assets.mjs) out of the synced assets dir, but capacitorCopyWebAssets above
// re-runs `cap copy` on *every* Gradle build, including release ones started straight from
// Android Studio without a prior `cap:sync`, silently re-copying those files back in moments
// before packaging (docs/jim-brief-gradle-copy-skips-prune.md). Debug builds intentionally rely
// on that re-copy to get dogfood-origin.json onto the device for LAN dogfooding
// (public/app.js readDogfoodOrigin, public/brisbane-dogfood.js), so the prune below only runs
// for release-variant task invocations, never unconditionally. A prune failure fails the task
// (and therefore the build) like any other Exec.
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

tasks.register('pruneShipAssets', Exec) {
    dependsOn 'capacitorCopyWebAssets'
    onlyIf { isReleaseBuild }
    workingDir "${projectDir}/../.."
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        commandLine 'cmd', '/c', 'node', 'scripts/prune-ship-assets.mjs'
    } else {
        commandLine 'node', 'scripts/prune-ship-assets.mjs'
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    it.dependsOn 'pruneShipAssets'
}
