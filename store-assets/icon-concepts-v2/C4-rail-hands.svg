<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- C4  Clock hands as rails from hub -->
  <rect width="512" height="512" rx="112" fill="#EEF3F2"/>
  <circle cx="256" cy="256" r="168" stroke="#0B6E6A" stroke-width="22" fill="none"/>
  <!-- sleeper ticks -->
  <rect x="246" y="72" width="20" height="36" rx="6" fill="#0B6E6A"/>
  <rect x="246" y="404" width="20" height="36" rx="6" fill="#0B6E6A"/>
  <rect x="72" y="246" width="36" height="20" rx="6" fill="#0B6E6A"/>
  <rect x="404" y="246" width="36" height="20" rx="6" fill="#0B6E6A"/>
  <!-- minute = long twin rail -->
  <path d="M236 256 L236 108 h16 L252 256 z" fill="#0B6E6A"/>
  <path d="M260 256 L260 108 h16 L276 256 z" fill="#0B6E6A"/>
  <rect x="228" y="160" width="56" height="14" rx="4" fill="#0B6E6A"/>
  <rect x="228" y="200" width="56" height="14" rx="4" fill="#0B6E6A"/>
  <!-- hour = shorter angled rail pair -->
  <g transform="rotate(110 256 256)">
    <path d="M236 256 L236 168 h16 L252 256 z" fill="#0B6E6A"/>
    <path d="M260 256 L260 168 h16 L276 256 z" fill="#0B6E6A"/>
  </g>
  <circle cx="256" cy="256" r="22" fill="#0B6E6A"/>
</svg>
