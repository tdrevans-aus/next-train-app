<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Next Train</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <button type="button" class="settings-btn" id="settings-btn" aria-label="Settings">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
              stroke="currentColor"
              stroke-width="1.75"
            />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <p class="route" id="route">Loading…</p>
        <p class="updated" id="updated">Updating…</p>
      </header>

      <section class="hero" id="hero">
        <p class="label">Leave by</p>
        <p class="time leave-time" id="leave-time">—</p>
        <p class="countdown" id="leave-countdown"></p>
      </section>

      <section class="details">
        <div class="detail-card">
          <p class="detail-label">Train arrives</p>
          <p class="detail-value" id="arrival-time">—</p>
          <p class="detail-sub" id="scheduled-time" hidden></p>
        </div>
        <div class="detail-card">
          <p class="detail-label">Platform</p>
          <p class="detail-value" id="platform">—</p>
        </div>
        <div class="detail-card">
          <p class="detail-label">Status</p>
          <p class="detail-value status" id="status">—</p>
        </div>
      </section>

      <section class="following" id="following-section" hidden>
        <p class="following-label">Then</p>
        <p class="following-value" id="following"></p>
      </section>

      <section class="ad-slot" id="ad-container" hidden aria-label="Advertisement"></section>

      <footer class="footer">
        <a href="/about.html">About</a>
        <span class="footer-dot">·</span>
        <a href="/privacy.html">Privacy</a>
      </footer>

      <p class="error" id="error" hidden></p>
    </main>

    <dialog class="settings-dialog" id="settings-dialog">
      <form method="dialog" class="settings-form" id="settings-form">
        <h2>Your commute</h2>
        <p class="settings-hint">Saved on this device only.</p>

        <label class="field">
          <span>Station</span>
          <select id="station-select" required></select>
        </label>

        <label class="field">
          <span>Direction</span>
          <select id="direction-select" required></select>
        </label>

        <label class="field">
          <span>Leave house before train (minutes)</span>
          <input
            type="number"
            id="leave-before-input"
            min="1"
            max="30"
            required
          />
        </label>

        <div class="settings-actions">
          <button type="button" class="btn-secondary" id="settings-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
    <script src="ads.js"></script>
  </body>
</html>
