# FB-64 production sweep (docs/jim-brief-prod-sweep.md) — hourly health check of every
# live city against production, since UptimeRobot only watches Perth (docs/go-live-ops.md).
#
# This workflow is monitoring, not CI: it never runs on push or pull_request, is not a
# required check on any branch ruleset, and qa/prod-sweep.mjs is never registered in
# qa/run-all.mjs at any tier — see the RUNNER_EXCLUDE entry there.
#
# State (consecutive error / empty-in-service-hours counts per city, used to avoid paging
# on single-run flapping) is a small JSON file committed back to the branch this workflow
# runs on, chosen over the Actions cache because cache entries are immutable per key and
# would need a new key (and eviction of the old one) every single hourly run — a plain
# committed file is one line to update and survives across runs with no extra machinery.
# The `contents: write` permission and concurrency group below are scoped to make that
# commit-back safe.
name: Production sweep

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Override target base URL (defaults to production)"
        required: false
        type: string

concurrency:
  group: prod-sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_SWEEP_BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run sweep
        id: sweep
        run: node qa/prod-sweep.mjs
      - name: Commit updated state
        if: always()
        run: |
          if ! git diff --quiet -- qa/prod-sweep-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add qa/prod-sweep-state.json
            git commit -m "prod-sweep: update state [skip ci]"
            git push
          else
            echo "no state change"
          fi
