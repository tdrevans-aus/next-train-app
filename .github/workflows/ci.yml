# FB-33 / QA-P2-03: smoke on every PR; full web + Android unit on main pushes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Web smoke (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run test:smoke
      - name: Release web suite (main)
        if: github.event_name == 'push'
        run: npm run test:web:release

  pin-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'
    env:
      QA_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Journey pin gates (fresh dev-server)
        run: |
          node qa/leave-by-preferred-gate.mjs
          node qa/pin-swipe-notify.mjs

  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Widget unit tests (pull requests)
        if: github.event_name == 'pull_request'
        run: node qa/run-android-unit.mjs --widget
      - name: Full Android unit tests (main)
        if: github.event_name == 'push'
        run: node qa/run-android-unit.mjs
