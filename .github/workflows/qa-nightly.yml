# FB-33 QA-P2-09: full web regression off the merge critical path.
name: QA nightly

on:
  schedule:
    # 02:00 UTC ≈ 10:00 Perth — off-peak for GitHub Actions.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  web-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Runs early in its own short step log, isolated from the flood of
      # [dev-server] request lines the main step below produces under
      # QA_VERBOSE, so this script's own output survives the GitHub job log
      # API's ~5,000-line truncation. continue-on-error so this step can never
      # turn the job red on its own — the main test:web:ci step below still
      # runs and reports this script's real result in its own summary.
      # docs/jim-brief-nightly-blob-integrity-visibility.md, 26 Sep 2026.
      - name: gtfs-live-blob-snapshot-integrity (diagnostic, non-blocking)
        run: node qa/gtfs-live-blob-snapshot-integrity.mjs
        continue-on-error: true
      - run: npm run test:web:ci
